<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image search</title>
    <script type="module" crossorigin src="/goit-advancedjs-hw-04/index.js"></script>
    <link rel="modulepreload" crossorigin href="/goit-advancedjs-hw-04/assets/vendor-BX8YMJUK.js">
    <link rel="stylesheet" crossorigin href="/goit-advancedjs-hw-04/assets/vendor-DumFYO8Z.css">

  </head>
  <body>
    <main class="container">
      <h1>Image search</h1>
      <form class="form">
        <label class="visually-hidden" for="search">Search images</label>
        <input id="search" name="search" type="search" placeholder="Search images…" maxlength="100" required />
        <button type="submit">Search</button>
      </form>
      <p class="credit">Photos from <a href="https://pixabay.com/" target="_blank" rel="noopener noreferrer">Pixabay</a></p>
      <ul class="gallery" aria-label="Image search results" aria-busy="false"></ul>
      <button class="load-more" type="button">Load more</button>
      <div class="loader" role="status"><span class="spinner" aria-hidden="true"></span>Loading images…</div>
    </main>
  </body>
</html>
